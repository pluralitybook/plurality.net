name = "plurality-ask"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true


# Uncomment when ask.plurality.net is a proxied DNS name in this CF account:
# [[routes]]
# pattern = "ask.plurality.net"
# custom_domain = true

[vars]
# "@cf/..." ids generate on the Workers AI binding above — no gateway hop, so
# no CF_AIG_TOKEN is needed. "nemotron-ultra" / "fugu" remain available via AI
# Gateway and DO need it (still set as a secret below).
AUDREY_MODEL = "@cf/deepseek-ai/deepseek-v4-flash-0731"

[ai]
binding = "AI"

[[vectorize]]
binding = "BOOK_VECTORIZE"
index_name = "plurality-book"

# Create index (once): wrangler vectorize create plurality-book --dimensions=1024 --metric=cosine
# Metadata index (once, BEFORE bulk upsert): wrangler vectorize create-metadata-index plurality-book --propertyName=lang --type=string
# See scripts/vectorize-sync-book.mjs ensureLangMetadataIndex()
# Secrets: CF_AIG_TOKEN (wrangler secret put) — needed only when AUDREY_MODEL is
# "nemotron-ultra" or "fugu" (AI Gateway is authenticated; without the token every
# gateway request 401s). "@cf/..." models generate on Workers AI and need no secret.

[dev]
port = 8788